name: 🚀 Deploy Website to Sakura Rental Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 📂 Sync files via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          protocol: sftp
          server-dir: /home/kogaku-sha/www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/wp-content/uploads/**
            **/wp-content/cache/**
            **/wp-content/backups/**
            README.md
            screenshot.png
